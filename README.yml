module_name: Terraform Cloudwatch Notifications Module
module_description: The Terraform Wrapper for Notifications provides the implementation of two lambdas to handle different types of notifications via Discord and/or Teams.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-notifications/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-notifications.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-wrapper-notifications.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/wrapper-notifications/aws"
    image: "https://img.shields.io/badge/Terraform-Registry-7B42BC?style=for-the-badge&logo=terraform&logoColor=white"
    alt: "Terraform Registry"
quick_start: |
  ```hcl
  notifications_parameters = {
    enable = true

    # DISCORD
    notifications_discord_webhook_url = ""
    alarms_discord_webhook_url        = ""

    # TEAMS
    notifications_teams_webhook_url = ""
    alarms_teams_webhook_url        = ""

    # sns_topic_arn = ""

    # EVENTBRIDGE RULES (optional)
    eventbridge_rules = {
      ecs_and_health = {
        name        = "my-project-health-rule"
        description = "ECS events and AWS Health events"
        event_pattern = jsonencode({
          "$or" = [
            { source = ["aws.ecs"] },
            { source = ["aws.health"], "detail-type" = ["AWS Health Event"] }
          ]
        })
      }
    }
  }
  ```
features:
  - icon: 📋
    title: Log Notifications
    short_description: Receives events from CloudWatch subscription filter and sends formatted log messages
    long_description: |
      Processes CloudWatch log events received via subscription filters and sends formatted notifications to Discord and/or Teams channels. 
      Supports both JSON structured logs and plain text logs with automatic parsing and color-coded severity levels (ERROR, WARN, DEBUG, INFO).
      Extracts additional metadata like source files and stack traces when available.
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          module "notifications" {
            source = "gocloudLa/wrapper-notifications/aws"
            
            notifications_parameters = {
              enable = true
              
              # Discord webhook for log notifications
              notifications_discord_webhook_url = var.notifications_discord_webhook_url
              
              # Teams webhook for log notifications  
              notifications_teams_webhook_url = var.notifications_teams_webhook_url
            }
          }
          ```
  - icon: 🚨
    title: Alarm Notifications
    short_description: Receives CloudWatch alarms and various AWS events, then sends formatted notifications
    long_description: |
      Processes multiple types of AWS events and sends formatted notifications to Discord and/or Teams:
      - **CloudWatch Alarms**: Processes alarm state changes with custom tags and metadata
      - **EventBridge Events**: Handles ECS task state changes and AWS Health events
      - **Budget Alerts**: Processes AWS Budget notifications with spending thresholds
      - **SES Events**: Handles email bounce, complaint, and delivery notifications
      - **Cost Anomaly Detection**: Processes cost anomaly alerts with impact and root cause details
      - **Unknown Events**: Gracefully handles unrecognized event formats
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          module "notifications" {
            source = "gocloudLa/wrapper-notifications/aws"
            
            notifications_parameters = {
              enable = true
              
              # Discord webhook for alarm notifications
              alarms_discord_webhook_url = var.alarms_discord_webhook_url
              
              # Teams webhook for alarm notifications
              alarms_teams_webhook_url = var.alarms_teams_webhook_url
              
              # Optional: Use existing SNS topic
              sns_topic_arn = var.sns_topic_arn
            }
          }
          ```
  - icon: 🔔
    title: EventBridge Rules
    short_description: Define custom EventBridge rules to route events directly to the alarm-notifications Lambda
    long_description: |
      Define custom EventBridge rules that route events directly to the alarm-notifications Lambda function without going through SNS.
      This is useful for events that are natively emitted to EventBridge (e.g., ECS task state changes, AWS Health events) and don't require an SNS topic intermediary.

      Each rule creates:
      - An `aws_cloudwatch_event_rule` with the specified event pattern
      - An `aws_cloudwatch_event_target` pointing to the alarm-notifications Lambda
      - An `aws_lambda_permission` allowing EventBridge to invoke the Lambda

      The rules map accepts the following attributes per entry:
      | Attribute | Description | Required |
      |-----------|-------------|----------|
      | `event_pattern` | JSON-encoded EventBridge event pattern | yes |
      | `name` | Custom name for the rule (defaults to `<prefix>-<key>`) | no |
      | `description` | Description of the rule | no |
      | `event_bus_name` | Event bus to attach the rule to (defaults to `default`) | no |
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          module "notifications" {
            source = "gocloudLa/wrapper-notifications/aws"
            
            notifications_parameters = {
              enable = true

              alarms_discord_webhook_url = var.alarms_discord_webhook_url
              alarms_teams_webhook_url   = var.alarms_teams_webhook_url

              eventbridge_rules = {
                ecs_and_health = {
                  name        = "${local.common_name}-health-rule"
                  description = "ECS events and AWS Health events"
                  event_pattern = jsonencode({
                    "$or" = [
                      { source = ["aws.ecs"] },
                      { source = ["aws.health"], "detail-type" = ["AWS Health Event"] }
                    ]
                  })
                }

                guardduty = {
                  name        = "${local.common_name}-guardduty-rule"
                  description = "GuardDuty findings"
                  event_pattern = jsonencode({
                    source      = ["aws.guardduty"]
                    detail-type = ["GuardDuty Finding"]
                  })
                }
              }
            }
          }
          ```
important_notes: |
  ## Adding a New Event Integration

  The alarm-notifications Lambda identifies each event type by inspecting specific keys in the SNS message payload.
  When a new AWS event needs to be supported, follow this workflow:

  ### 1. Capture the raw event

  Trigger the event in your AWS account and let it reach the Lambda. If the event type is not yet handled,
  it will be processed by `process_unknown_message` and the raw payload will be printed in the CloudWatch Logs
  of the Lambda (look for `RAW_EVENT` in the failure log). Copy that full JSON payload.

  ### 2. Save the example event

  Create a new JSON file under `lambdas/alarm-notifications/examples/` with a descriptive name
  (e.g. `cost_anomaly.json`, `guardduty.json`). The file must contain the full SNS-wrapped structure
  including the `Records` array, since that is what the Lambda receives as input. Replace any
  sensitive values (account IDs, ARNs, endpoints) with placeholder values like `XXXXXX`.

  ### 3. Identify the detection key

  The Lambda parses `Records[].Sns.Message` as JSON. The routing logic in the function `process_records` checks for a
  unique key in that parsed object to determine the event type.

  Current detection table:

  | Event Type              | Detection Logic                                              |
  |-------------------------|--------------------------------------------------------------|
  | CloudWatch Alarm        | `dict` with key `AlarmName`                                  |
  | EventBridge             | `dict` with key `detail`                                     |
  | Budget Notification     | `string` containing `AWS Budget Notification`                |
  | SES Notification        | `dict` with key `notificationType`                           |
  | Cost Anomaly Detection  | `dict` with key `anomalyId`                                  |
  | Unknown (fallback)      | Any event that does not match the above conditions           |

  To add a new type, find a top-level key in your event's JSON that is **unique** and not present
  in any of the existing event types. Then add a new `elif` branch in the `process_records`
  function inside `lambdas/alarm-notifications/index.py`, **before** the `else` (unknown) block.

  ### 4. Build the processor function

  Create a new function following the naming convention `process_<event_type>_message(record_timestamp, record_message)`.
  The function must return a dict with exactly three keys:

  ```python
  return {
      'title': str,     # Summary line shown as the notification title
      'message': dict,  # Key-value pairs displayed in the notification body
      'color': int      # Integer color value from get_color()
  }
  ```

  **Extracting fields:** Use `.get('key', 'default')` to safely read each field from the event.
  This prevents `KeyError` exceptions when optional fields are missing. For nested fields,
  chain `.get()` calls.

  **Color values:** The `get_color(value)` function maps a severity string to a color integer.
  If your event does not have a clear severity mapping, simply use `get_color()` (no arguments)
  and it will default to red. You can also add new severity mappings to `get_color()` if needed.

  **Building the message dict:** The keys in the `message` dict become the labels in the
  notification. Keep key names short (under 20 characters) so they align properly in the
  fixed-width formatting used by Discord and Teams. The values should be strings or
  easily printable types.

  ### 5. Test the integration

  1. Open the **AWS Console** and navigate to the **Lambda** service.
  2. Find the **alarm-notifications** Lambda function.
  3. Go to the **Test** tab.
  4. Paste the full example JSON event from `lambdas/alarm-notifications/examples/`.
  5. Click **Test** and verify:
     - The Lambda executes **without errors** (check the Execution result panel).
     - The notification arrives in Discord and/or Teams with the expected format.

  > **Note:** Make sure the Lambda has the `DISCORD_WEBHOOK_URL` and/or `TEAMS_WEBHOOK_URL`
  > environment variables configured, otherwise notifications will not be sent even if the
  > function executes successfully.

  ### 6. Update documentation

  - Add the new event type to the `long_description` of the **Alarm Notifications** feature in this file.
  - Add a new row to the detection logic table in this section (step 3).
input_table: |
  | enable | Controls the creation of services | `bool` | `"true"` | no |
  | notifications_discord_webhook_url | Discord Webhook endpoint for log notifications | `string` | `""` | no |
  | alarms_discord_webhook_url | Discord Webhook endpoint for alarm notifications | `string` | `""` | no |
  | notifications_teams_webhook_url | Teams Webhook endpoint for log notifications | `string` | `""` | no |
  | alarms_teams_webhook_url | Teams Webhook endpoint for alarm notifications | `string` | `""` | no |
  | sns_topic_arn | ARN of an existing SNS Topic for sending messages | `string` | `""` | no |
  | eventbridge_rules | Map of EventBridge rules to route events to the alarm-notifications Lambda | `map(object)` | `{}` | no |
  | tags | A map of tags to assign to resources. | `map` | `{}` | no |
