title: "Complete Example"
description: "This example demonstrates a Terraform configuration for setting up notification parameters using a module, including custom EventBridge rules."
main_purpose: "The main purpose is to configure notification parameters for various services such as Discord and Teams, and define EventBridge rules to route AWS events directly to the alarm-notifications Lambda."
key_features:
  - "**Enable Notifications**: Enables or disables the notification system"
  - "**Discord Webhook Url**: Specifies the webhook URL for Discord notifications"
  - "**Teams Webhook Url**: Specifies the webhook URL for Microsoft Teams notifications"
  - "**EventBridge Rules**: Defines custom EventBridge rules with event patterns to route events (e.g., ECS, AWS Health) directly to the alarm-notifications Lambda"
